{% extends "base.html" %}{% block title %}Create Account | HireSmartAI{% endblock %}
{% block content %}<div class="form-wrap"><div class="form-card"><p class="eyebrow">JOIN HIRESMARTAI</p><h1>Create your account</h1><p class="muted">Choose how you want to use the platform.</p><form method="post">
<label>Full name</label><input name="name" required maxlength="100" placeholder="Your name">
<label>Email address</label><input name="email" type="email" required placeholder="you@example.com">
<label>Password</label><input name="password" type="password" required minlength="6" placeholder="At least 6 characters">
<label>Account type</label><select name="role"><option value="candidate">Candidate / Student</option><option value="recruiter">Recruiter / HR</option></select>
<button class="btn primary full" type="submit">Create account</button></form><p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></div>{% endblock %}
